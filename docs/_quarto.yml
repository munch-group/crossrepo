project:
  type: website
  output-dir: _build
  # resources:
  #   - objects.txt
  #   - objects-test.txt

execute:
  freeze: auto
  echo: true

metadata-files:
  - api/_sidebar.yml

filters:
  - "interlinks"

interlinks:
  fast: true
  sources:
    python:
      url: https://docs.python.org/3/
    griffe:
      url: https://mkdocstrings.github.io/griffe/
    numpy:
      url: https://numpy.org/doc/stable/
    pandas:
      url: https://pandas.pydata.org/docs/
    matplotlib:
      url: https://matplotlib.org/stable/
    scipy:
      url: https://docs.scipy.org/doc/scipy/
    statsmodels:
      url: https://www.statsmodels.org/stable/
    # quartodoc-test:
    #   url: https://machow.github.io/quartodoc
    #   inv: objects-test.txt

website:
  title: "labdata"
  page-navigation: true
  navbar:
    left:
      - href: api/
        text: API reference
      # - href: gallery/
      #   text: Gallery
    right:
      - icon: github
        href: https://github.com/munch-group/labdata/
  sidebar:
    - id: pages
      title: Get Started
      style: floating
      align: left
      contents:
        - pages/overview.ipynb
        - section: "Examples"
          contents:
            - pages/example.ipynb                   

lightbox: true

format:
  html:
    theme: cosmo
    css:
      - api/_styles-quartodoc.css
      - styles.css
      # - custom.scss
    toc: true
    # code-block-background: false
    # code-block-border-left: true    
    # highlight-style: arrow
    mermaid:
      theme: neutral 

quartodoc:
  package: labdata
  style: pkgdown
  dir: api
  render_interlinks: true
  options:
    signature_name: full
  renderer:
    style: markdown
    table_style: description-list
  sidebar: "api/_sidebar.yml"
  css: "api/_styles-quartodoc.css"

  sections:
    - title: Catalog
      package: labdata
      desc: |
        Finding out what the repositories publish.
      contents:
        - catalog
        - build
        - frame
    - title: Fetching
      package: labdata
      desc: |
        Getting a local path to one version of a result file.
      contents:
        - fetch
        - versions
    - title: Resolving
      package: labdata.core
      desc: |
        Turning a spec such as `repo:file@version` into one entry and one
        version.
      contents:
        - resolve_one
        - match
        - find_version
        - scan_repo
        - repo_identity
        - materialize
    - title: Data types
      package: labdata
      desc: |
        What the catalog is made of.
      contents:
        - Entry
        - Version
        - Spec
    - title: Configuration
      package: labdata
      desc: |
        Which directories are searched and which files are cataloged.
      contents:
        - Config
    - title: Cache
      package: labdata.cache
      desc: |
        The content-addressed store keyed by git blob sha.
      contents:
        - blob_path
        - readable_path
        - store
        - store_from_file
        - open_for_write
        - link
        - usage
    - title: Git access
      package: labdata.gitutil
      desc: |
        Plumbing wrappers used to read repositories.
      contents:
        - discover_repos
        - tracked_blobs
        - last_commits
        - file_history
        - blob_at
        - tag_map
        - read_blob
        - write_blob_to
        - parse_lfs_pointer
        - lfs_object_path
    - title: Command line
      package: labdata.cli
      desc: |
        Entry points behind the `labdata` command.
      contents:
        - main
        - build_parser
