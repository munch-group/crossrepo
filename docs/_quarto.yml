project:
  type: website
  output-dir: _build
  # resources:
  #   - objects.txt
  #   - objects-test.txt

execute:
  freeze: auto
  echo: true

metadata-files:
  - api/_sidebar.yml

filters:
  - "interlinks"

render:
  - "pages/cli.qmd"

interlinks:
  fast: true
  sources:
    python:
      url: https://docs.python.org/3/
    griffe:
      url: https://mkdocstrings.github.io/griffe/
    numpy:
      url: https://numpy.org/doc/stable/
    pandas:
      url: https://pandas.pydata.org/docs/
    matplotlib:
      url: https://matplotlib.org/stable/
    scipy:
      url: https://docs.scipy.org/doc/scipy/
    statsmodels:
      url: https://www.statsmodels.org/stable/
    # quartodoc-test:
    #   url: https://machow.github.io/quartodoc
    #   inv: objects-test.txt

website:
  title: "crossrepo"
  page-navigation: true
  navbar:
    left:
      - href: api/
        text: API reference
      - href: pages/cli.html
        text: API reference
      # - href: gallery/
      #   text: Gallery
    right:
      - icon: github
        href: https://github.com/munch-group/crossrepo/
  sidebar:
    - id: pages
      title: Get Started
      style: floating
      align: left
      contents:
        - pages/overview.ipynb
        - section: "Tutorials"
          contents:
            - pages/api.ipynb

lightbox: true

format:
  html:
    theme: cosmo
    css:
      - api/_styles-quartodoc.css
      - styles.css
      # - custom.scss
    toc: true
    # code-block-background: false
    # code-block-border-left: true    
    # highlight-style: arrow
    mermaid:
      theme: neutral 

quartodoc:
  package: crossrepo
  style: pkgdown
  dir: api
  render_interlinks: true
  options:
    signature_name: full
  renderer:
    style: markdown
    table_style: description-list
  sidebar: "api/_sidebar.yml"
  css: "api/_styles-quartodoc.css"

  sections:
    - title: Catalog
      package: crossrepo
      desc: |
        Finding out what the repositories publish.
      contents:
        - list
        - repos
        - versions
        - refresh
        - frame
        - catalog
        - build
        - diagnose
    - title: Fetching
      package: crossrepo
      desc: |
        Getting a local path to one version of a result file.
      contents:
        - get
        - info
        - fetch
        - outdated
    - title: Resolving
      package: crossrepo.core
      desc: |
        Turning a spec such as `repo:file@version` into one entry and one
        version.
      contents:
        - resolve_one
        - match
        - selects
        - find_version
        - describe
        - fingerprint
        - scan_repo
        - repo_identity
        - materialize
        - progress_bar
        - copy_out
    - title: Data types
      package: crossrepo
      desc: |
        What the catalog is made of.
      contents:
        - Entry
        - Version
        - Spec

    - title: Tables
      package: crossrepo.table
      desc: |
        The data frame the catalog functions hand back.
      contents:
        # Its own page name, because `crossrepo.cli.table` already has `table`
        # and a case-insensitive filesystem makes those one file.
        - kind: page
          path: table-class
          contents:
            - Table

    - title: GitHub
      package: crossrepo.remote
      desc: |
        Cataloguing and fetching repositories over the GitHub API, without
        cloning them.
      contents:
        # These three share a name with the one in the main API, and a shared
        # name is a shared page: without a path of their own they overwrite
        # `crossrepo.build`, `crossrepo.core.scan_repo` and `crossrepo.versions`,
        # which are then linked from the index as anchors that are not there.
        - kind: page
          path: remote-build
          contents:
            - build
        - kind: page
          path: remote-scan_repo
          contents:
            - scan_repo
        - kind: page
          path: remote-versions
          contents:
            - versions
        - version_at
        - dataset_files
        - download

    - title: GitHub API
      package: crossrepo.github
      desc: |
        The client the GitHub backend reads with.
      contents:
        - Client
        - token
        - blob_url
        - GitHubError

    - title: Manifests
      package: crossrepo.manifest
      desc: |
        The `crossrepo.yml` by which a repository states what it publishes, what
        each published file holds, and, for a file published as a symbolic link,
        which content that link stands for.
      contents:
        - Manifest
        - Stamp
        - parse
        - write_entry
        - write_stamp
        - quote_key
        - is_manifest
        - manifest_path
        - ManifestError
    - title: Configuration
      package: crossrepo.config
      desc: |
        Which directories are searched, which files are cataloged, and where
        settings and the cache live.
      contents:
        - Config
        - use_config
        - active_config
        - Registration
        - config_path
        - local_config_path
        - config_in_force
        - setting_type
        - write_setting
        - clear_setting
        - render_setting
        - cache_root
    - title: Cache
      package: crossrepo.cache
      desc: |
        The content-addressed store, keyed by git blob sha, by Git LFS object
        id, or by the stamp of a file published as a symbolic link.
      contents:
        - blob_path
        - readable_path
        - store
        - store_from_file
        - open_for_write
        - open_staging
        - link
        - objects
        - content_hash
        - tree_parts
        - tree_hash
        - check_object
        - discard
        - usage
    - title: Git access
      package: crossrepo.gitutil
      desc: |
        Plumbing wrappers used to read repositories.
      contents:
        - discover_repos
        - tracked_blobs
        - tracked_entries
        - head_commit
        - file_history
        - blob_at
        - entry_at
        - tree_at
        - tree_files
        - tag_map
        - read_blob
        - write_blob_to
        - write_file_to
        - parse_lfs_pointer
        - lfs_object_path
        - link_target
        - resolve_link
        - list_files
        - GitError
    - title: Command line
      package: crossrepo.cli
      desc: |
        Entry points behind the `crossrepo` command.
      contents:
        - main
        - table
        - human
        - note
